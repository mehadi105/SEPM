name: university-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ums
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
    ports:
      - "5432:5432"
    volumes:
      - ums-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d ums"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ums
      DB_USER: ums
      DB_PASSWORD: ums
      JWT_SECRET: harborview-university-lab-jwt-secret-key-32b
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  ums-data:
